<html lang="en" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Quest × Pronix.ai Test Results AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#F4F6F2;--card:#FFFFFF;--ink:#1B2418;--muted:#586253;--rule:#D8DED3;--green:#4A7637;--deep:#2D4D21;--lime:#B9C930;--soft:#EEF3DC;--err:#B8440F;--err-soft:#FCE6D8;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);display:flex;flex-direction:column}
.brandbar{height:6px;background:linear-gradient(90deg,var(--green) 0 78%,var(--lime) 78% 100%)}
main{flex:1;display:grid;place-items:center;padding:32px 20px}
.panel{width:100%;max-width:420px;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 30px 28px}
.lockup{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.lockup img{height:40px;width:auto;display:block}
.lockup .sep{width:1px;height:28px;background:var(--rule)}
.lockup .x{color:var(--muted);font:600 15px var(--f-display)}
.lockup .px{font:700 16px var(--f-display)}
h1{font:800 26px/1.15 var(--f-display);margin:0 0 6px;letter-spacing:-.01em}
.lede{margin:0 0 22px;color:var(--muted)}
.err{background:var(--err-soft);color:var(--err);border-radius:10px;padding:10px 12px;font-weight:600;margin:0 0 16px}
label{display:block;font-weight:700;font-size:14.5px;margin:0 0 6px}
input{width:100%;font:17px var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;margin:0 0 16px}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--lime) 45%,transparent)}
button{width:100%;appearance:none;border:0;border-radius:10px;background:var(--green);color:#fff;font:700 17px var(--f-body);padding:12px;cursor:pointer;margin-top:4px}
button:hover{background:var(--deep)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.foot{margin:18px 0 0;font-size:14px;color:var(--muted)}
</style>
</head>
